[project]
name = "pwa-portal"
version = "0.1.0"
description = "Open-source PWA hosting portal for small businesses"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.16",
    "pydantic-settings>=2.0",
    "itsdangerous>=2.1",
    "bcrypt>=4.1",
    "cryptography>=42",
    "email-validator>=2.1",
    "weasyprint>=60",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["portal*"]

[tool.setuptools.package-data]
portal = ["templates/**/*", "static/**/*"]
