[project]
name = "pwa-portal"
version = "0.16.2"
description = "Open-source PWA hosting portal for small businesses"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Jacob Scheatzle" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.16",
    "pydantic-settings>=2.0",
    "itsdangerous>=2.1",
    "bcrypt>=4.1",
    "cryptography>=42",
    "email-validator>=2.1",
    "weasyprint>=60",
]

[project.optional-dependencies]
# Opt-in: enables the portal-hosted MCP app-management server at /mcp (see
# docs/mcp.md). Kept out of the base deps so the default install and the Docker
# image stay lean; install with `pip install 'pwa-portal[mcp]'` or build the
# image with --build-arg INSTALL_MCP=true. Also requires MCP_ENABLED=true at
# runtime.
# The <2 ceiling is load-bearing, not tidiness. mcp 2.0.0 removed the
# low-level decorator API this portal is built on: `Server.list_tools` and
# `Server.call_tool` are simply gone (mcp_server.py:1115 and the handlers
# below it). Because `build_mcp_app()` is called at import time from
# main.py, that's not a degraded /mcp endpoint — uvicorn raises
# AttributeError before it can bind, and the container crash-loops.
#
# This bit us for real: the image is built from unpinned ranges, so a
# rebuild five weeks after the previous one silently resolved 1.x -> 2.0.0
# and took the portal down on the next `docker compose pull`. Nothing in the
# application had changed. Raise the ceiling only alongside a port of
# mcp_server.py to whatever 2.x replaced the decorators with.
mcp = ["mcp>=1.27,<2"]

# Opt-in: the AWS deployment backends — PostgreSQL (RDS) via psycopg and S3
# object storage via boto3. Kept out of the base deps so the default install
# and the Docker image stay lean (local SQLite + filesystem need neither).
# Install with `pip install 'pwa-portal[aws]'` or build the image with
# --build-arg INSTALL_AWS=true. Also requires STORAGE_BACKEND=s3 +
# DATABASE_URL=postgresql+psycopg://... at runtime. See aws/README.md.
aws = ["boto3>=1.34", "psycopg[binary]>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["portal*"]

[tool.setuptools.package-data]
portal = ["templates/**/*", "static/**/*"]
