# Production-ready compose file. Pulls pre-built images from GitHub Container
# Registry — no source code required on the host.
#
# Quickstart on a fresh VPS:
#   curl -O https://raw.githubusercontent.com/jacob-scheatzle/claude-pwa-portal/main/docker-compose.yml
#   curl -o .env https://raw.githubusercontent.com/jacob-scheatzle/claude-pwa-portal/main/.env.example
#   # edit .env: set SITE_URL + SECRET_KEY
#   mkdir -p data && sudo chown -R 1001:1001 data
#   docker compose pull && docker compose up -d
#
# Developers working from a cloned repo: docker-compose.override.yml in the
# repo root replaces the `image:` references below with local `build:`
# directives. It's auto-merged by docker compose, so `docker compose up`
# builds locally.

services:
  portal:
    image: ghcr.io/jacob-scheatzle/claude-pwa-portal:${PORTAL_IMAGE_TAG:-latest}
    user: "1001:1001"
    environment:
      SITE_URL: ${SITE_URL:-localhost}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      DATABASE_URL: sqlite:////data/portal.db
      DATA_DIR: /data
      COOKIES_SECURE: ${COOKIES_SECURE:-true}
      HTTP_ONLY: ${HTTP_ONLY:-false}
      CHILD_APPS_SAME_ORIGIN: ${CHILD_APPS_SAME_ORIGIN:-false}
      # Blank = auto (on; the image bundles the mcp dep). Set MCP_ENABLED=false
      # in .env to disable the /mcp endpoint. See docs/mcp.md.
      MCP_ENABLED: ${MCP_ENABLED:-}
      # Proxy hops whose X-Forwarded-For uvicorn trusts when deriving the client
      # IP. Blank → the image default (private ranges: trusts Caddy, ignores a
      # client-spoofed header). Set to your LB's IP/CIDR only if it terminates
      # TLS on a public address with no Caddy in front. See docs/deploying.md.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-}
    volumes:
      - ./data:/data
    expose:
      - "8000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # read_only locks the container's root filesystem; the only writable paths
    # are the explicit volume (./data) and the tmpfs below. Combined with
    # PYTHONDONTWRITEBYTECODE=1 in the Dockerfile (otherwise Python tries to
    # write .pyc into a read-only site-packages on every import), this means
    # a code-exec exploit can't drop a webshell anywhere persistent.
    read_only: true
    tmpfs: [/tmp]
    # Resource caps prevent a single misbehaving child-app (or DoS attempt
    # that gets past Caddy + fail2ban) from exhausting host RAM/CPU. The
    # portal itself is tiny — WeasyPrint renders are the only memory spike
    # path — so 768M is comfortable headroom. pids_limit blocks fork-bomb
    # style attacks. Tune up if you host many concurrent users.
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 100
    # Tag the container's stdout/stderr with a stable journald identifier so
    # host-side tooling (``journalctl -t pwa-portal``, fail2ban for ad-hoc
    # log inspection) reads a predictable stream. The actual fail2ban ban
    # signal lives in ``./data/security.log`` — a focused, fail2ban-friendly
    # text log written by ``portal/audit.py`` — so journald is informational
    # here. See ``docs/fail2ban.md``.
    logging:
      driver: journald
      options:
        tag: pwa-portal
    restart: unless-stopped

  caddy:
    image: ghcr.io/jacob-scheatzle/claude-pwa-portal-caddy:${PORTAL_IMAGE_TAG:-latest}
    ports:
      - "80:80"
      # Port 443 is unused when HTTP_ONLY=true (Caddy never binds it). Safe
      # to leave; comment out if something else on the host needs 443.
      - "443:443"
    environment:
      SITE_URL: ${SITE_URL:-localhost}
      # Selects Caddyfile.http (plain HTTP, no auto-HTTPS) when true.
      HTTP_ONLY: ${HTTP_ONLY:-false}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    # Same read_only + tmpfs treatment as portal. Caddy writes its on-demand
    # TLS certs and ACME state to the named volumes (caddy_data, caddy_config)
    # mounted above; /tmp covers transient scratch.
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 50
    # journald tag for Caddy's JSON access log (emitted to stdout from the
    # Caddyfile ``log`` directive). fail2ban's pwa-portal-caddy filter reads
    # ``SYSLOG_IDENTIFIER=pwa-portal-caddy`` to ban scanners at the proxy
    # layer before requests even reach uvicorn. See ``docs/fail2ban.md``.
    logging:
      driver: journald
      options:
        tag: pwa-portal-caddy
    # Ordering only — deliberately NOT `condition: service_healthy`, even
    # though the portal now has a HEALTHCHECK (see Dockerfile). Gating Caddy
    # on the backend's health means a portal that never goes healthy keeps
    # the proxy down entirely, and a Caddy that isn't running also isn't
    # answering ACME challenges — so a bad deploy could quietly cost you the
    # certificate on top of the outage.
    #
    # The startup race that gate would have closed is already covered from
    # the other side: the Caddyfile's `lb_try_duration` retries a failed dial
    # for 15s, which spans the window where the portal container is up but
    # uvicorn hasn't bound yet because migrations are still running. The
    # healthcheck is for visibility — `docker compose ps` and `docker events`
    # tell you the real state without being load-bearing.
    depends_on:
      - portal
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

# Pinned network identity. Docker's default is a generated name and a subnet
# leased from its address pool, both of which change whenever the network is
# recreated (`docker compose down`, a host reboot with a different creation
# order, adding another stack). Anything that references them by value — a
# fail2ban / iptables rule, a `-i br-xxxx` match, an allowlisted CIDR — silently
# stops matching, or worse, starts matching whatever inherited the old range.
#
# Pinning all three makes those references stable, and makes a stale rule
# naming an old subnet match nothing at all rather than something unintended.
#
# DOCKER_SUBNET is overridable because 172.20.0.0/16 can collide with an
# existing network on some hosts; `docker compose up` then fails with "Pool
# overlaps with other one on this address space". Set DOCKER_SUBNET in .env to
# any free /16 if that happens. Check what's in use with:
#   docker network inspect $(docker network ls -q) \
#     --format '{{.Name}} {{range .IPAM.Config}}{{.Subnet}}{{end}}'
#
# Changing any of this on a running stack needs `docker compose down` first —
# Docker cannot re-address a network in place.
networks:
  default:
    name: pwa-portal
    driver: bridge
    driver_opts:
      # The Linux bridge interface name, as it appears in `ip a` and in
      # iptables rules. Capped at 15 characters by the kernel.
      com.docker.network.bridge.name: br-pwa-portal
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.20.0.0/16}
