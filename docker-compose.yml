services:
  portal:
    build: .
    user: "1001:1001"
    environment:
      SITE_URL: ${SITE_URL:-localhost}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      DATABASE_URL: sqlite:////data/portal.db
      DATA_DIR: /data
    volumes:
      - ./data:/data
    expose:
      - "8000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_URL: ${SITE_URL:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    depends_on:
      - portal
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
