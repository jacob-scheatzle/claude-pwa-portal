<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Hello Receipt</title>
	<script src="/portal-sdk.js"></script>
	<style>
		:root { color-scheme: light dark; --accent: #075985; --accent-bg: #e0f2fe; --muted: #64748b; }
		* { box-sizing: border-box; }
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			max-width: 38rem;
			margin: 2rem auto;
			padding: 0 1.25rem 4rem;
			line-height: 1.5;
		}
		h1 { margin: 0 0 0.25rem; font-size: 1.6rem; }
		h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.7; margin: 2rem 0 0.75rem; }
		.muted { color: var(--muted); font-size: 0.9rem; }
		form { display: flex; flex-direction: column; gap: 0.75rem; }
		.row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
		label { font-weight: 600; font-size: 0.85rem; }
		input, textarea {
			width: 100%;
			padding: 0.6rem 0.75rem;
			border: 1px solid rgba(127,127,127,0.4);
			border-radius: 0.375rem;
			background: transparent;
			color: inherit;
			font-size: 1rem;
			font-family: inherit;
		}
		textarea { resize: vertical; min-height: 5rem; }
		.actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.25rem; }
		button {
			padding: 0.65rem 1rem;
			border: 0;
			border-radius: 0.375rem;
			background: var(--accent);
			color: white;
			font-weight: 600;
			cursor: pointer;
		}
		button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
		button.linkish { background: transparent; color: var(--accent); padding: 0.25rem 0.5rem; font-size: 0.85rem; }
		.status { min-height: 1.4em; font-size: 0.9rem; margin: 0.5rem 0 0; }
		.status.error { color: #b91c1c; }
		.status.success { color: #15803d; }
		.history-row {
			padding: 0.75rem 0;
			border-bottom: 1px solid rgba(127,127,127,0.18);
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 1rem;
			flex-wrap: wrap;
		}
		.history-row:last-child { border-bottom: 0; }
		.history-meta strong { display: block; }
	</style>
</head>
<body>
	<h1>Hello Receipt</h1>
	<p id="me" class="muted">Loading…</p>

	<h2>New receipt</h2>
	<form id="form" autocomplete="off">
		<div class="row">
			<div>
				<label for="name">Customer name</label>
				<input name="name" id="name" required>
			</div>
			<div>
				<label for="email">Customer email</label>
				<input name="email" id="email" type="email" required>
			</div>
		</div>
		<div class="row">
			<div>
				<label for="amount">Amount (USD)</label>
				<input name="amount" id="amount" type="number" step="0.01" min="0.01" required>
			</div>
			<div>
				<label for="description">Description</label>
				<input name="description" id="description" required>
			</div>
		</div>
		<div>
			<label for="notes">Notes (optional)</label>
			<textarea name="notes" id="notes" rows="3"></textarea>
		</div>
		<label style="font-weight:500;"><input type="checkbox" id="email_too" checked> Also email the receipt to the customer</label>
		<div class="actions">
			<button type="submit">Send receipt</button>
			<button type="button" class="secondary" id="preview">Preview PDF only</button>
		</div>
	</form>
	<p id="status" class="status"></p>

	<h2>Past receipts</h2>
	<div id="history" class="muted">Loading…</div>

	<script>
		const $ = (id) => document.getElementById(id);
		const status = $("status");

		function setStatus(message, level) {
			status.textContent = message || "";
			status.className = "status" + (level ? " " + level : "");
		}

		function escapeHtml(s) {
			return String(s ?? "").replace(/[&<>"']/g, (c) => (
				{ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
			));
		}

		function fmtMoney(n) {
			return "$" + Number(n || 0).toFixed(2);
		}

		function newReceiptId() {
			// Sortable: <epoch_ms>-<random4>
			const r = Math.floor(Math.random() * 0xffff).toString(16).padStart(4, "0");
			return `${Date.now()}-${r}`;
		}

		function receiptHtml(d) {
			const today = new Date().toLocaleDateString();
			const notes = d.notes
				? `<tr><td class="label">Notes</td><td>${escapeHtml(d.notes)}</td></tr>`
				: "";
			return `<!doctype html><html><head><meta charset="utf-8"><style>
				body { font-family: -apple-system, "Segoe UI", sans-serif; max-width: 36rem; margin: 2rem auto; padding: 0 1.5rem; color: #0f172a; }
				h1 { border-bottom: 2px solid #075985; padding-bottom: 0.5rem; margin: 0 0 1rem; }
				table { width: 100%; border-collapse: collapse; margin: 1rem 0 1.5rem; }
				td { padding: 0.4rem 0.6rem; vertical-align: top; }
				td.label { font-weight: 600; width: 32%; color: #475569; }
				.total { font-size: 1.5rem; font-weight: 700; color: #075985; border-top: 2px solid #e2e8f0; padding-top: 1rem; margin-top: 1rem; }
				.footer { margin-top: 2.5rem; font-size: 0.8rem; color: #94a3b8; }
			</style></head><body>
			<h1>Receipt</h1>
			<table>
				<tr><td class="label">Customer</td><td>${escapeHtml(d.name)}</td></tr>
				<tr><td class="label">Email</td><td>${escapeHtml(d.email)}</td></tr>
				<tr><td class="label">Date</td><td>${today}</td></tr>
				<tr><td class="label">Description</td><td>${escapeHtml(d.description)}</td></tr>
				${notes}
			</table>
			<div class="total">Total: ${fmtMoney(d.amount)}</div>
			<div class="footer">Generated via PWA Portal — Hello Receipt example.</div>
			</body></html>`;
		}

		async function loadHistory() {
			const el = $("history");
			try {
				const { items } = await portal.storage.list();
				const receipts = items
					.filter((i) => i.key.startsWith("receipts/") && i.key.endsWith(".json"))
					.sort((a, b) => b.key.localeCompare(a.key))
					.slice(0, 20);

				if (receipts.length === 0) {
					el.className = "muted";
					el.textContent = "No receipts yet.";
					return;
				}

				el.className = "";
				el.innerHTML = "";
				for (const item of receipts) {
					const data = await portal.storage.get(item.key);
					const row = document.createElement("div");
					row.className = "history-row";
					row.innerHTML = `
						<div class="history-meta">
							<strong>${escapeHtml(data.name)}</strong>
							<span class="muted">${escapeHtml(data.email)} &middot; ${fmtMoney(data.amount)}</span>
						</div>
						<div>
							<button type="button" class="linkish" data-action="redownload" data-key="${escapeHtml(item.key)}">Re-download</button>
							<button type="button" class="linkish" data-action="delete" data-key="${escapeHtml(item.key)}">Delete</button>
						</div>
					`;
					el.appendChild(row);
				}
			} catch (err) {
				el.className = "muted";
				el.textContent = "Couldn't load history: " + err.message;
			}
		}

		document.addEventListener("click", async (e) => {
			const btn = e.target.closest("button[data-action]");
			if (!btn) return;
			const key = btn.dataset.key;
			const action = btn.dataset.action;
			try {
				if (action === "redownload") {
					const data = await portal.storage.get(key);
					await portal.pdf.download({
						html: receiptHtml(data),
						filename: `receipt-${data.name.replace(/\s+/g, "_")}.pdf`,
					});
				} else if (action === "delete") {
					if (!confirm("Delete this receipt from history?")) return;
					await portal.storage.delete(key);
					loadHistory();
				}
			} catch (err) {
				setStatus("Error: " + err.message, "error");
			}
		});

		$("preview").addEventListener("click", async () => {
			const data = Object.fromEntries(new FormData($("form")));
			if (!data.name || !data.email || !data.amount) {
				setStatus("Fill in name, email, and amount first.", "error");
				return;
			}
			setStatus("Generating preview…");
			try {
				await portal.pdf.download({
					html: receiptHtml(data),
					filename: "receipt-preview.pdf",
				});
				setStatus("");
			} catch (err) {
				setStatus("PDF render failed: " + err.message, "error");
			}
		});

		$("form").addEventListener("submit", async (e) => {
			e.preventDefault();
			const data = Object.fromEntries(new FormData(e.target));
			data.amount = Number(data.amount);
			const wantEmail = $("email_too").checked;

			if (!(data.amount > 0)) {
				setStatus("Amount must be greater than 0.", "error");
				return;
			}

			setStatus("Saving + rendering PDF…");
			const id = newReceiptId();
			const html = receiptHtml(data);

			try {
				await portal.storage.put(`receipts/${id}.json`, { id, ...data, savedAt: new Date().toISOString() });
				await portal.pdf.download({
					html,
					filename: `receipt-${id}.pdf`,
				});

				if (wantEmail) {
					setStatus("PDF downloaded. Emailing the customer…");
					try {
						await portal.email.send({
							to: data.email,
							subject: `Receipt for ${data.description}`,
							html,
						});
						setStatus(`Sent. Saved as #${id}.`, "success");
					} catch (err) {
						setStatus(`PDF + saved, but email failed: ${err.message}`, "error");
					}
				} else {
					setStatus(`PDF downloaded. Saved as #${id}.`, "success");
				}

				e.target.reset();
				$("email_too").checked = true;
				loadHistory();
			} catch (err) {
				setStatus("Error: " + err.message, "error");
			}
		});

		(async () => {
			try {
				const me = await portal.user.current();
				$("me").textContent = `Signed in as ${me.email}.`;
			} catch (err) {
				$("me").textContent = "Couldn't reach the portal: " + err.message;
				return;
			}
			loadHistory();
		})();
	</script>
</body>
</html>
