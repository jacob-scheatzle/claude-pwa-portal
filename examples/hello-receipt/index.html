<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Hello Receipt</title>
	<script src="/portal-sdk.js"></script>
	<style>
		/* PWA Portal design tokens — keep in sync with portal/templates/base.html. */
		:root {
			color-scheme: light dark;
			--bg: #fafaf9;
			--surface: #ffffff;
			--surface-2: #f5f5f4;
			--border: #e7e5e4;
			--border-strong: #d6d3d1;
			--text: #1c1917;
			--text-muted: #57534e;
			--text-faint: #78716c;
			--accent: #059669;
			--accent-hover: #047857;
			--accent-fg: #ffffff;
			--accent-tint: #ecfdf5;
			--accent-soft: rgba(5, 150, 105, 0.12);
			--danger: #b91c1c;
			--success: #15803d;
			--radius-sm: 0.4rem;
			--radius: 0.55rem;
			--shadow-sm: 0 1px 2px rgba(15,23,42,0.05), 0 1px 1px rgba(15,23,42,0.025);
			--shadow: 0 2px 4px rgba(15,23,42,0.06), 0 1px 2px rgba(15,23,42,0.04);
			--font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI",
				Roboto, "Helvetica Neue", Arial, sans-serif;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--bg: #0c0a09; --surface: #1c1917; --surface-2: #292524;
				--border: #292524; --border-strong: #44403c;
				--text: #fafaf9; --text-muted: #a8a29e; --text-faint: #78716c;
				--accent: #10b981; --accent-hover: #34d399; --accent-fg: #0c0a09;
				--accent-tint: #064e3b; --accent-soft: rgba(16,185,129,0.18);
				--danger: #f87171; --success: #4ade80;
				--shadow-sm: 0 1px 2px rgba(0,0,0,0.4), 0 1px 1px rgba(0,0,0,0.25);
				--shadow: 0 2px 4px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.3);
			}
		}

		* { box-sizing: border-box; }
		body {
			font-family: var(--font-sans);
			background: var(--bg);
			color: var(--text);
			margin: 0;
			line-height: 1.55;
			-webkit-font-smoothing: antialiased;
		}
		.shell {
			max-width: 38rem;
			margin: 0 auto;
			padding: 2rem 1.5rem 4rem;
		}
		h1 { margin: 0 0 0.25rem; font-size: 1.75rem; font-weight: 700; letter-spacing: -0.025em; }
		h2 {
			font-size: 0.72rem;
			text-transform: uppercase;
			letter-spacing: 0.08em;
			color: var(--text-muted);
			font-weight: 700;
			margin: 2rem 0 0.75rem;
		}
		.muted { color: var(--text-muted); font-size: 0.9rem; }

		.card {
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			padding: 1.25rem 1.4rem;
			box-shadow: var(--shadow-sm);
		}

		form { display: flex; flex-direction: column; gap: 0.85rem; }
		.row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem; }
		label { font-weight: 600; font-size: 0.85rem; display: block; margin-bottom: 0.3rem; }
		input, textarea {
			width: 100%;
			padding: 0.65rem 0.85rem;
			border: 1px solid var(--border-strong);
			border-radius: var(--radius-sm);
			background: var(--surface);
			color: var(--text);
			font-size: 0.95rem;
			font-family: inherit;
			transition: border-color 0.12s ease, box-shadow 0.12s ease;
		}
		input:focus, textarea:focus {
			outline: 0;
			border-color: var(--accent);
			box-shadow: 0 0 0 3px var(--accent-soft);
		}
		textarea { resize: vertical; min-height: 5rem; line-height: 1.5; }
		.checkbox-row {
			display: flex;
			align-items: center;
			gap: 0.5rem;
			font-weight: 500;
			font-size: 0.9rem;
			color: var(--text);
			margin: 0.25rem 0;
		}
		.checkbox-row input { width: auto; padding: 0; }

		.actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem; }
		button {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 0.4rem;
			padding: 0.6rem 1.05rem;
			border: 0;
			border-radius: var(--radius-sm);
			background: var(--accent);
			color: var(--accent-fg);
			font-weight: 600;
			font-size: 0.925rem;
			font-family: inherit;
			cursor: pointer;
			box-shadow: var(--shadow-sm);
			transition: background 0.12s ease, box-shadow 0.12s ease, transform 0.06s ease;
		}
		button:hover { background: var(--accent-hover); box-shadow: var(--shadow); }
		button:active { transform: translateY(1px); box-shadow: none; }
		button.secondary {
			background: var(--surface);
			color: var(--accent);
			border: 1px solid var(--border-strong);
			box-shadow: none;
		}
		button.secondary:hover { background: var(--accent-tint); border-color: var(--accent); }
		button.linkish {
			background: transparent;
			color: var(--accent);
			padding: 0.25rem 0.5rem;
			font-size: 0.875rem;
			box-shadow: none;
			font-weight: 500;
		}
		button.linkish:hover { background: var(--accent-soft); }

		.status { min-height: 1.4em; font-size: 0.9rem; margin: 0.65rem 0 0; color: var(--text-muted); }
		.status.error { color: var(--danger); }
		.status.success { color: var(--success); }

		.history-row {
			padding: 0.85rem 0;
			border-bottom: 1px solid var(--border);
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 1rem;
			flex-wrap: wrap;
		}
		.history-row:last-child { border-bottom: 0; }
		.history-meta strong { display: block; letter-spacing: -0.005em; }
		.history-meta .muted { font-size: 0.85rem; }
	</style>
</head>
<body>
<main class="shell">
	<h1>Hello Receipt</h1>
	<p id="me" class="muted">Loading…</p>

	<h2>New receipt</h2>
	<div class="card">
	<form id="form" autocomplete="off">
		<div class="row">
			<div>
				<label for="name">Customer name</label>
				<input name="name" id="name" required>
			</div>
			<div>
				<label for="email">Customer email</label>
				<input name="email" id="email" type="email" required>
			</div>
		</div>
		<div class="row">
			<div>
				<label for="amount">Amount (USD)</label>
				<input name="amount" id="amount" type="number" step="0.01" min="0.01" required>
			</div>
			<div>
				<label for="description">Description</label>
				<input name="description" id="description" required>
			</div>
		</div>
		<div>
			<label for="notes">Notes (optional)</label>
			<textarea name="notes" id="notes" rows="3"></textarea>
		</div>
		<label class="checkbox-row"><input type="checkbox" id="email_too" checked> Also email the receipt to the customer</label>
		<div class="actions">
			<button type="submit">Send receipt</button>
			<button type="button" class="secondary" id="preview">Preview PDF only</button>
		</div>
	</form>
	</div>
	<p id="status" class="status"></p>

	<h2>Past receipts</h2>
	<div class="card">
	<div id="history" class="muted">Loading…</div>
	</div>
</main>

	<script>
		const $ = (id) => document.getElementById(id);
		const status = $("status");

		function setStatus(message, level) {
			status.textContent = message || "";
			status.className = "status" + (level ? " " + level : "");
		}

		function escapeHtml(s) {
			return String(s ?? "").replace(/[&<>"']/g, (c) => (
				{ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
			));
		}

		function fmtMoney(n) {
			return "$" + Number(n || 0).toFixed(2);
		}

		function newReceiptId() {
			const ts = String(Date.now()).padStart(14, "0");
			const r = Math.floor(Math.random() * 0xffff).toString(16).padStart(4, "0");
			return `${ts}-${r}`;
		}

		function safeFilename(name) {
			return String(name).replace(/[^A-Za-z0-9._-]+/g, "_").slice(0, 80) || "receipt";
		}

		function receiptHtml(d) {
			const today = new Date().toLocaleDateString();
			const notes = d.notes
				? `<tr><td class="label">Notes</td><td>${escapeHtml(d.notes)}</td></tr>`
				: "";
			return `<!doctype html><html><head><meta charset="utf-8"><style>
				body { font-family: -apple-system, "Segoe UI", sans-serif; max-width: 36rem; margin: 2rem auto; padding: 0 1.5rem; color: #0f172a; }
				h1 { border-bottom: 2px solid #075985; padding-bottom: 0.5rem; margin: 0 0 1rem; }
				table { width: 100%; border-collapse: collapse; margin: 1rem 0 1.5rem; }
				td { padding: 0.4rem 0.6rem; vertical-align: top; }
				td.label { font-weight: 600; width: 32%; color: #475569; }
				.total { font-size: 1.5rem; font-weight: 700; color: #075985; border-top: 2px solid #e2e8f0; padding-top: 1rem; margin-top: 1rem; }
				.footer { margin-top: 2.5rem; font-size: 0.8rem; color: #94a3b8; }
			</style></head><body>
			<h1>Receipt</h1>
			<table>
				<tr><td class="label">Customer</td><td>${escapeHtml(d.name)}</td></tr>
				<tr><td class="label">Email</td><td>${escapeHtml(d.email)}</td></tr>
				<tr><td class="label">Date</td><td>${today}</td></tr>
				<tr><td class="label">Description</td><td>${escapeHtml(d.description)}</td></tr>
				${notes}
			</table>
			<div class="total">Total: ${fmtMoney(d.amount)}</div>
			<div class="footer">Generated via PWA Portal — Hello Receipt example.</div>
			</body></html>`;
		}

		async function loadHistory() {
			const el = $("history");
			try {
				const { items } = await portal.storage.list();
				const receipts = items
					.filter((i) => i.key.startsWith("receipts/") && i.key.endsWith(".json"))
					.sort((a, b) => b.key.localeCompare(a.key))
					.slice(0, 20);

				if (receipts.length === 0) {
					el.className = "muted";
					el.textContent = "No receipts yet.";
					return;
				}

				el.className = "";
				el.innerHTML = "";
				for (const item of receipts) {
					const data = await portal.storage.get(item.key);
					const row = document.createElement("div");
					row.className = "history-row";
					row.innerHTML = `
						<div class="history-meta">
							<strong>${escapeHtml(data.name)}</strong>
							<span class="muted">${escapeHtml(data.email)} &middot; ${fmtMoney(data.amount)}</span>
						</div>
						<div>
							<button type="button" class="linkish" data-action="redownload" data-key="${escapeHtml(item.key)}">Re-download</button>
							<button type="button" class="linkish" data-action="delete" data-key="${escapeHtml(item.key)}">Delete</button>
						</div>
					`;
					el.appendChild(row);
				}
			} catch (err) {
				el.className = "muted";
				el.textContent = "Couldn't load history: " + err.message;
			}
		}

		document.addEventListener("click", async (e) => {
			const btn = e.target.closest("button[data-action]");
			if (!btn) return;
			const key = btn.dataset.key;
			const action = btn.dataset.action;
			try {
				if (action === "redownload") {
					const data = await portal.storage.get(key);
					await portal.pdf.download({
						html: receiptHtml(data),
						filename: safeFilename(`receipt-${data.name}.pdf`),
					});
				} else if (action === "delete") {
					if (!confirm("Delete this receipt from history?")) return;
					await portal.storage.delete(key);
					loadHistory();
				}
			} catch (err) {
				setStatus("Error: " + err.message, "error");
			}
		});

		$("preview").addEventListener("click", async () => {
			const data = Object.fromEntries(new FormData($("form")));
			if (!data.name || !data.email || !data.amount) {
				setStatus("Fill in name, email, and amount first.", "error");
				return;
			}
			setStatus("Generating preview…");
			try {
				await portal.pdf.download({
					html: receiptHtml(data),
					filename: safeFilename("receipt-preview.pdf"),
				});
				setStatus("");
			} catch (err) {
				setStatus("PDF render failed: " + err.message, "error");
			}
		});

		$("form").addEventListener("submit", async (e) => {
			e.preventDefault();
			const data = Object.fromEntries(new FormData(e.target));
			data.amount = Number(data.amount);
			const wantEmail = $("email_too").checked;

			if (!(data.amount > 0)) {
				setStatus("Amount must be greater than 0.", "error");
				return;
			}

			setStatus("Saving + rendering PDF…");
			const id = newReceiptId();
			const html = receiptHtml(data);

			try {
				await portal.storage.put(`receipts/${id}.json`, { id, ...data, savedAt: new Date().toISOString() });
				await portal.pdf.download({
					html,
					filename: safeFilename(`receipt-${id}.pdf`),
				});

				if (wantEmail) {
					setStatus("PDF downloaded. Emailing the customer…");
					try {
						await portal.email.send({
							to: data.email,
							subject: `Receipt for ${data.description}`,
							html,
						});
						setStatus(`Sent. Saved as #${id}.`, "success");
					} catch (err) {
						setStatus(`PDF + saved, but email failed: ${err.message}`, "error");
					}
				} else {
					setStatus(`PDF downloaded. Saved as #${id}.`, "success");
				}

				e.target.reset();
				$("email_too").checked = true;
				loadHistory();
			} catch (err) {
				setStatus("Error: " + err.message, "error");
			}
		});

		(async () => {
			try {
				const me = await portal.user.current();
				$("me").textContent = `Signed in as ${me.email}.`;
			} catch (err) {
				$("me").textContent = "Couldn't reach the portal: " + err.message;
				return;
			}
			loadHistory();
		})();
	</script>
</body>
</html>
