# fail2ban filter — failed portal logins
#
# Reads ``data/security.log`` (a stable, single-line, space-separated text
# log written by ``portal/audit.py`` on every login failure or rate-limit
# hit). The format is deliberately simple so this regex doesn't depend on
# uvicorn's access-log format, which can change between versions.
#
# Matched line shapes:
#   2026-05-27T14:35:18Z FAILED_LOGIN ip=45.88.138.44 email=foo@bar reason=bad_credentials
#   2026-05-27T14:36:02Z LOGIN_RATE_LIMITED ip=45.88.138.44 email=foo@bar reason=rate_limited
#
# fail2ban auto-detects and removes the ISO timestamp prefix before
# applying failregex — the patterns below intentionally don't anchor
# on ``^`` so they match the remainder of the line whether the date
# is stripped to ``FAILED_LOGIN …`` or left as ``<date> FAILED_LOGIN …``.
#
# Banning on LOGIN_RATE_LIMITED too is what catches a fast attacker before
# they trip many bad-credentials matches: the portal's in-process limiter
# starts dropping at 5 fails / 10 minutes per (ip, email), and that drop
# itself is the signal fail2ban needs.
#
# See docs/fail2ban.md for the full setup.

[Definition]
failregex = FAILED_LOGIN\s+ip=<HOST>
            LOGIN_RATE_LIMITED\s+ip=<HOST>

ignoreregex =
