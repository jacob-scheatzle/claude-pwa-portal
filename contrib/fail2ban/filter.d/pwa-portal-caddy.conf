# fail2ban filter — Caddy-layer scanner sweep
#
# Reads Caddy's JSON access log from journald (SYSLOG_IDENTIFIER=pwa-portal-caddy;
# set by the docker-compose ``logging.driver: journald`` block on the caddy
# service). Each handled request emits one JSON line containing
# ``"client_ip"`` and ``"uri"``. We anchor failregex entries on bait paths
# that are unambiguously scanner traffic — banning at the Caddy layer
# means the request never wastes CPU on uvicorn.
#
# Deliberately does NOT match generic 404s; legit users mistyping a URL
# would get banned. Only paths where there's no plausible reason a real
# browser would ever fetch them.
#
# Notes on the regex:
#   - ``client_ip`` (not ``remote_ip``) is the right field: Caddy populates
#     it from X-Forwarded-For when behind a TLS-terminating proxy.
#   - ``.*?`` between client_ip and uri is non-greedy so the regex stops at
#     the first ``"uri":"..."`` match; using ``[^}]*`` would break on the
#     ``"headers":{}`` substring that Caddy emits in every line.
#   - URL-encoded variants (``%%40`` for ``@``, etc.) are matched where
#     scanners use them — they show up that way in the access log.
#     The literal ``%`` must be doubled (``%%``) in fail2ban filter files
#     because ConfigParser interprets a single ``%`` as the start of an
#     interpolation token; a literal ``%40`` makes the whole filter fail
#     to load with "'%' must be followed by '%' or '('".
#
# See docs/fail2ban.md for the journald-backend setup.

[Definition]
failregex = "client_ip":"<HOST>".*?"uri":"/\.env(\.[a-z.]+)?"
            "client_ip":"<HOST>".*?"uri":"/\.git/
            "client_ip":"<HOST>".*?"uri":"/\.aws/
