# fail2ban jails for ProgressiveWebAppPortal.
#
# Copy to ``/etc/fail2ban/jail.d/pwa-portal.conf`` on the VPS, then
# ``sudo systemctl restart fail2ban``. See docs/fail2ban.md for the
# end-to-end setup recipe (Caddyfile changes, docker-compose log driver,
# verifying the filters against live logs).
#
# Default banaction is fail2ban's system default (``iptables-multiport``
# on most distros). If you're using nftables / firewalld / ufw, set
# ``banaction`` per jail or globally — fail2ban ships actions for each.

# --- Portal login failures ------------------------------------------------
#
# Reads the focused security.log written by portal/audit.py. logpath
# assumes the standard docker-compose bind-mount with the repo cloned (or
# ``docker-compose.yml`` placed) at ``/home/ubuntu/my-portal``; adjust if
# your deploy path differs.
#
# 5 failures in 10 minutes = 1 hour ban. Escalates exponentially on
# repeat offenders (requires fail2ban >= 0.11).

[pwa-portal-login]
enabled  = true
filter   = pwa-portal-login
logpath  = /home/ubuntu/my-portal/data/security.log
maxretry = 5
findtime = 10m
bantime  = 1h
bantime.increment = true
bantime.factor    = 2
bantime.maxtime   = 24h


# --- Caddy-layer scanner sweep --------------------------------------------
#
# Bans IPs probing for /.env, /.git/, /wp-admin/, etc. before they reach
# uvicorn. Reads Caddy's JSON access log from journald via the
# pwa-portal-caddy tag set in docker-compose.yml.
#
# 3 bait-path hits in 5 minutes = 24 hour ban. The threshold is low
# because legit users don't fetch these paths even by accident.

[pwa-portal-caddy]
enabled  = true
filter   = pwa-portal-caddy
backend  = systemd
journalmatch = SYSLOG_IDENTIFIER=pwa-portal-caddy
maxretry = 3
findtime = 5m
bantime  = 24h
bantime.increment = true
bantime.factor    = 2
bantime.maxtime   = 7d
