# fail2ban jail — SSH brute-force protection
#
# Reads systemd's sshd journal via the package-shipped sshd filter
# (/etc/fail2ban/filter.d/sshd.conf) so this config doesn't need a
# dedicated filter file. The filter matches:
#
#   - "Failed password" / "Invalid user" lines
#   - "authentication failure" lines
#   - "Connection closed by authenticating user" (preauth abort)
#
# 5 failed auth attempts in 10 minutes triggers a 1 hour ban, escalating
# exponentially on repeat offenders (1h -> 2h -> 4h -> 8h, capped at 7
# days). Bantime increment requires fail2ban >= 0.11.
#
# ----- Custom SSH port? -----
#
# The default ``port = 22`` only inserts iptables rules for port 22. If
# you run sshd on a non-standard port (highly recommended — cuts about
# 99% of the brute-force noise), update the line below to include both
# the standard port AND your real one, e.g.:
#
#   port = 22,42069
#
# The sshd FILTER doesn't care which port sshd is actually listening on
# (it watches the journal); the PORT directive only controls which port
# the firewall rule blocks when a ban fires. Listing both means a banned
# IP can't probe either port for the duration.

[sshd]
enabled  = true
port     = 22
maxretry = 5
findtime = 10m
bantime  = 1h
bantime.increment = true
bantime.factor    = 2
bantime.maxtime   = 7d
