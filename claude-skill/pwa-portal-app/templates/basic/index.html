<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>REPLACE ME</title>
	<script src="/portal-sdk.js"></script>
	<style>
		:root { color-scheme: light dark; --accent: #075985; }
		* { box-sizing: border-box; }
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			max-width: 32rem;
			margin: 2rem auto;
			padding: 0 1.25rem;
			line-height: 1.55;
		}
		h1 { margin: 0 0 0.5rem; font-size: 1.6rem; }
		form { display: flex; flex-direction: column; gap: 0.75rem; }
		label { font-weight: 600; font-size: 0.85rem; }
		input, textarea, select {
			width: 100%;
			padding: 0.6rem 0.75rem;
			border: 1px solid rgba(127,127,127,0.4);
			border-radius: 0.375rem;
			background: transparent;
			color: inherit;
			font-size: 1rem;
		}
		button {
			padding: 0.65rem 1rem;
			border: 0;
			border-radius: 0.375rem;
			background: var(--accent);
			color: white;
			font-weight: 600;
			cursor: pointer;
		}
		.status { font-size: 0.9rem; opacity: 0.8; min-height: 1.2em; }
	</style>
</head>
<body>
	<h1 id="title">REPLACE ME</h1>
	<p id="hello" class="status">Loading…</p>

	<!-- Replace the body below with your app's UI -->

	<script>
		(async () => {
			try {
				const me = await portal.user.current();
				document.getElementById("hello").textContent = `Signed in as ${me.email}.`;
			} catch (err) {
				document.getElementById("hello").textContent = "Couldn't reach the portal: " + err.message;
			}
		})();
	</script>
</body>
</html>
