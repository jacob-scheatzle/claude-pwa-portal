<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>REPLACE ME</title>
	<script src="/portal-sdk.js"></script>
	<style>
		/* PWA Portal — shared design tokens (v2).
		   Keep these in sync with the portal shell so child apps inherit a
		   consistent look. Colors track @media (prefers-color-scheme). */
		:root {
			color-scheme: light dark;
			--bg: #fafaf9;
			--surface: #ffffff;
			--surface-2: #f5f5f4;
			--border: #e7e5e4;
			--border-strong: #d6d3d1;
			--text: #1c1917;
			--text-muted: #57534e;
			--text-faint: #78716c;
			/* Accent family is DERIVED from --accent — change one variable to
			   re-skin the app. --lift is what hover mixes toward (black in light,
			   white in dark); the *-amt percentages strengthen tints in dark mode. */
			--accent: #059669;
			--accent-fg: #ffffff;
			--lift: #000000;
			--tint-amt: 9%;
			--soft-amt: 14%;
			--accent-hover: color-mix(in srgb, var(--accent) 85%, var(--lift));
			--accent-tint: color-mix(in srgb, var(--accent) var(--tint-amt), var(--surface));
			--accent-soft: color-mix(in srgb, var(--accent) var(--soft-amt), transparent);
			--accent-glow: color-mix(in srgb, var(--accent) 28%, transparent);
			--danger: #b91c1c;
			--danger-tint: #fef2f2;
			--warn: #b45309;
			--warn-tint: #fef3c7;
			--success: #15803d;
			--success-tint: #ecfdf5;
			--radius-sm: 0.5rem;
			--radius: 0.7rem;
			--radius-lg: 1rem;
			--shadow-sm: 0 1px 2px rgba(28,25,23,0.06), 0 1px 1px rgba(28,25,23,0.03);
			--shadow: 0 2px 6px rgba(28,25,23,0.07), 0 1px 2px rgba(28,25,23,0.05);
			--shadow-md: 0 10px 24px -6px rgba(28,25,23,0.12), 0 3px 8px rgba(28,25,23,0.06);
			--font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI",
				Roboto, "Helvetica Neue", Arial, sans-serif;
			--font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--bg: #0c0a09;
				--surface: #1c1917;
				--surface-2: #292524;
				--border: #292524;
				--border-strong: #44403c;
				--text: #fafaf9;
				--text-muted: #a8a29e;
				--text-faint: #78716c;
				--accent: #10b981;
				--accent-fg: #0c0a09;
				--lift: #ffffff;
				--tint-amt: 18%;
				--soft-amt: 22%;
				--danger: #f87171;
				--danger-tint: #450a0a;
				--warn: #fbbf24;
				--warn-tint: #451a03;
				--success: #4ade80;
				--success-tint: #052e16;
				--shadow-sm: 0 1px 2px rgba(0,0,0,0.4), 0 1px 1px rgba(0,0,0,0.25);
				--shadow: 0 2px 6px rgba(0,0,0,0.5), 0 1px 2px rgba(0,0,0,0.3);
				--shadow-md: 0 10px 24px -6px rgba(0,0,0,0.6), 0 3px 8px rgba(0,0,0,0.35);
			}
		}

		* { box-sizing: border-box; }
		body {
			font-family: var(--font-sans);
			background:
				radial-gradient(70rem 30rem at 50% -14rem, var(--accent-soft), transparent 70%),
				var(--bg);
			color: var(--text);
			margin: 0;
			min-height: 100svh;
			line-height: 1.55;
			-webkit-font-smoothing: antialiased;
		}
		::selection { background: var(--accent-soft); }
		.shell {
			max-width: 36rem;
			margin: 0 auto;
			padding: 2rem 1.5rem 4rem;
		}
		h1 {
			margin: 0 0 0.5rem;
			font-size: 1.6rem;
			font-weight: 700;
			letter-spacing: -0.025em;
		}
		.muted { color: var(--text-muted); font-size: 0.9rem; }
		label { font-weight: 600; font-size: 0.85rem; display: block; margin-bottom: 0.3rem; }
		input, textarea, select {
			width: 100%;
			padding: 0.65rem 0.85rem;
			border: 1px solid var(--border-strong);
			border-radius: var(--radius-sm);
			background: var(--surface);
			color: var(--text);
			font-size: 0.95rem;
			font-family: inherit;
			transition: border-color 0.12s ease, box-shadow 0.12s ease;
		}
		input:focus, textarea:focus, select:focus {
			outline: 0;
			border-color: var(--accent);
			box-shadow: 0 0 0 3px var(--accent-soft);
		}
		button {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 0.4rem;
			padding: 0.6rem 1.1rem;
			border: 1px solid color-mix(in srgb, var(--accent) 80%, #000);
			border-radius: var(--radius-sm);
			background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 88%, #fff), var(--accent));
			color: var(--accent-fg);
			font-weight: 600;
			font-size: 0.925rem;
			font-family: inherit;
			cursor: pointer;
			box-shadow: 0 1px 2.5px var(--accent-glow), inset 0 1px 0 color-mix(in srgb, #fff 28%, transparent);
			transition: background 0.12s ease, box-shadow 0.12s ease, transform 0.06s ease;
		}
		button:hover { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 78%, #fff), color-mix(in srgb, var(--accent) 94%, #fff)); }
		button:active { transform: translateY(1px); box-shadow: none; }
		button.secondary {
			background: var(--surface);
			color: var(--accent);
			border: 1px solid var(--border-strong);
			box-shadow: none;
		}
		button.secondary:hover { background: var(--accent-tint); border-color: var(--accent); }
		a:focus-visible, button:focus-visible, input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
		.card {
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius-lg);
			padding: 1.5rem 1.6rem;
			box-shadow: var(--shadow-sm);
		}
		.status { font-size: 0.9rem; color: var(--text-muted); min-height: 1.2em; }
	</style>
</head>
<body>
	<main class="shell">
		<h1 id="title">REPLACE ME</h1>
		<p id="hello" class="status">Loading…</p>

		<!-- Replace the body below with your app's UI. -->

		<script>
			(async () => {
				try {
					const me = await portal.user.current();
					document.getElementById("hello").textContent =
						`Signed in as ${me.email}.`;
				} catch (err) {
					document.getElementById("hello").textContent =
						"Couldn't reach the portal: " + err.message;
				}
			})();
		</script>
	</main>
</body>
</html>
