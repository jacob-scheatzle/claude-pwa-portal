<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>{% block title %}PWA Portal{% endblock %}</title>

	<link rel="manifest" href="/manifest.webmanifest">
	<link rel="icon" type="image/png" href="/static/icons/favicon.png">
	<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
	<meta name="theme-color" content="#075985">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="default">
	<meta name="apple-mobile-web-app-title" content="Portal">
	<meta name="mobile-web-app-capable" content="yes">
	<style>
		:root { color-scheme: light dark; --accent: #075985; --accent-bg: #e0f2fe; }
		* { box-sizing: border-box; }
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			margin: 0;
			line-height: 1.55;
		}
		.container { max-width: 32rem; margin: 0 auto; padding: 2.5rem 1.5rem; }
		.container.wide { max-width: 56rem; }
		.row-between { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
		.topbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 0.75rem 1.5rem;
			border-bottom: 1px solid rgba(127,127,127,0.2);
		}
		.topbar .brand { font-size: 0.95rem; font-weight: 700; }
		h1 { margin: 0 0 0.75rem; font-size: 1.6rem; }
		p { margin: 0.5rem 0 1.25rem; }
		form { display: flex; flex-direction: column; gap: 0.85rem; }
		label { font-weight: 600; font-size: 0.85rem; display: block; margin-bottom: 0.25rem; }
		input[type=email], input[type=password], input[type=text] {
			width: 100%;
			padding: 0.6rem 0.75rem;
			border: 1px solid rgba(127,127,127,0.4);
			border-radius: 0.375rem;
			font-size: 1rem;
			background: transparent;
			color: inherit;
		}
		input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
		button {
			padding: 0.65rem 1rem;
			border: 0;
			border-radius: 0.375rem;
			background: var(--accent);
			color: white;
			font-weight: 600;
			font-size: 0.95rem;
			cursor: pointer;
		}
		button.linkish {
			background: transparent;
			color: var(--accent);
			padding: 0;
			font-weight: 500;
			font-size: 0.85rem;
			cursor: pointer;
		}
		button.linkish.danger { color: #b91c1c; }
		.nav-link { font-size: 0.85rem; color: var(--accent); text-decoration: none; font-weight: 500; }
		.nav-link:hover { text-decoration: underline; }
		input[type=file] {
			padding: 0.5rem;
			border: 1px dashed rgba(127,127,127,0.4);
			border-radius: 0.375rem;
			width: 100%;
			background: rgba(127,127,127,0.04);
			font-size: 0.9rem;
		}
		input[type=file]::file-selector-button {
			margin-right: 0.75rem;
			padding: 0.35rem 0.75rem;
			border: 0;
			border-radius: 0.25rem;
			background: var(--accent);
			color: white;
			font-size: 0.85rem;
			cursor: pointer;
		}
		select {
			padding: 0.4rem 0.6rem;
			border: 1px solid rgba(127,127,127,0.4);
			border-radius: 0.375rem;
			background: transparent;
			color: inherit;
			font-size: 0.9rem;
		}
		fieldset {
			border: 1px solid rgba(127,127,127,0.22);
			border-radius: 0.5rem;
			padding: 1rem 1.25rem;
			margin: 1.25rem 0;
		}
		fieldset > legend {
			font-weight: 700;
			font-size: 0.72rem;
			text-transform: uppercase;
			letter-spacing: 0.06em;
			opacity: 0.75;
			padding: 0 0.5rem;
		}
		fieldset > div + div { margin-top: 0.85rem; }
		.topbar nav { flex-wrap: wrap; row-gap: 0.5rem; }
		pre {
			background: rgba(127,127,127,0.08);
			padding: 0.75rem 1rem;
			border-radius: 0.375rem;
			overflow-x: auto;
			font-size: 0.8rem;
			line-height: 1.4;
		}
		.pill { display: inline-block; padding: 0.15rem 0.55rem; border-radius: 9999px; font-size: 0.72rem; font-weight: 600; }
		.pill.on { background: #dcfce7; color: #166534; }
		.pill.off { background: #fee2e2; color: #991b1b; }
		table.apps { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.9rem; }
		table.apps th, table.apps td { text-align: left; padding: 0.6rem 0.5rem; border-bottom: 1px solid rgba(127,127,127,0.18); vertical-align: top; }
		table.apps th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; opacity: 0.7; font-weight: 600; }
		table.apps code { background: rgba(127,127,127,0.1); padding: 0.1rem 0.35rem; border-radius: 0.25rem; font-size: 0.85em; }
		td.actions { white-space: nowrap; display: flex; gap: 0.75rem; align-items: center; }
		.flashes { margin: 1rem 0 0.5rem; display: flex; flex-direction: column; gap: 0.5rem; }
		.flash { padding: 0.65rem 0.9rem; border-radius: 0.375rem; background: #ecfdf5; color: #065f46; }
		.flash.flash-error { background: #fee2e2; color: #991b1b; }
		.error {
			background: #fee2e2;
			color: #991b1b;
			padding: 0.75rem 1rem;
			border-radius: 0.375rem;
			margin-bottom: 1rem;
		}
		.error ul { list-style: disc; padding-left: 1.25rem; margin: 0; }
		.hint { font-size: 0.8rem; opacity: 0.7; margin-top: 0.25rem; }
		.tile-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(7rem, 1fr));
			gap: 1rem;
			margin-top: 1rem;
		}
		.tile {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 0.5rem;
			padding: 1rem 0.75rem;
			border-radius: 0.75rem;
			text-decoration: none;
			color: inherit;
			background: rgba(127,127,127,0.07);
			border: 1px solid rgba(127,127,127,0.18);
			transition: background 0.15s, transform 0.1s;
		}
		.tile:hover { background: rgba(127,127,127,0.13); }
		.tile:active { transform: scale(0.97); }
		.tile img { width: 3rem; height: 3rem; border-radius: 0.5rem; }
		.tile span { font-size: 0.85rem; font-weight: 500; text-align: center; }
		.empty {
			text-align: center;
			padding: 2.5rem 1rem;
			background: rgba(127,127,127,0.04);
			border-radius: 0.75rem;
			border: 1px dashed rgba(127,127,127,0.25);
			margin-top: 0.5rem;
		}
		.empty h2 { margin: 0 0 0.5rem; font-size: 1.15rem; }
		.empty p { margin: 0.25rem 0; }
		@media (prefers-color-scheme: dark) {
			.error { background: #7f1d1d; color: #fecaca; }
			.flash { background: #064e3b; color: #d1fae5; }
			.flash.flash-error { background: #7f1d1d; color: #fecaca; }
			.pill.on { background: #064e3b; color: #d1fae5; }
			.pill.off { background: #7f1d1d; color: #fecaca; }
		}
		@supports (padding: env(safe-area-inset-top)) {
			.topbar { padding-top: max(0.75rem, env(safe-area-inset-top)); }
		}
	</style>
</head>
<body>
	{% block topbar %}
	{% if user %}
	<div class="topbar">
		<a href="/" style="text-decoration:none; color:inherit;" class="brand">PWA Portal</a>
		<nav style="display:flex; align-items:center; gap:1rem;">
			{% if user.role == "admin" %}
			<a href="/admin/apps" class="nav-link">Apps</a>
			<a href="/admin/users" class="nav-link">Users</a>
			<a href="/admin/settings" class="nav-link">Settings</a>
			<a href="/admin/tokens" class="nav-link">Tokens</a>
			{% endif %}
			<a href="/profile" class="nav-link">Profile</a>
			<form method="post" action="/logout" style="margin:0;">
				<input type="hidden" name="_csrf" value="{{ csrf_token }}">
				<button type="submit" class="linkish">Sign out ({{ user.email }})</button>
			</form>
		</nav>
	</div>
	{% endif %}
	{% endblock %}
	<main class="container {% block container_class %}{% endblock %}">
		{% if flashes %}
		<div class="flashes">
			{% for f in flashes %}
			<div class="flash flash-{{ f.level }}">{{ f.message }}</div>
			{% endfor %}
		</div>
		{% endif %}
		{% block content %}{% endblock %}
	</main>

	<script>
		if ("serviceWorker" in navigator) {
			window.addEventListener("load", () => {
				navigator.serviceWorker.register("/sw.js").catch((e) => console.warn("SW register failed", e));
			});
		}
	</script>
</body>
</html>
