<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>{% block title %}PWA Portal{% endblock %}</title>

	<link rel="manifest" href="/manifest.webmanifest">
	<link rel="icon" type="image/png" href="/static/icons/favicon.png">
	<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
	<meta name="theme-color" content="#059669">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Portal">
	<meta name="mobile-web-app-capable" content="yes">
	<style>
		:root {
			color-scheme: light dark;
			/* Stone neutrals + emerald accent. */
			--bg: #fafaf9;
			--surface: #ffffff;
			--surface-2: #f5f5f4;
			--border: #e7e5e4;
			--border-strong: #d6d3d1;
			--text: #1c1917;
			--text-muted: #57534e;
			--text-faint: #78716c;

			--accent: #059669;
			--accent-hover: #047857;
			--accent-fg: #ffffff;
			--accent-tint: #ecfdf5;
			--accent-soft: rgba(5, 150, 105, 0.12);

			--danger: #b91c1c;
			--danger-fg: #ffffff;
			--danger-tint: #fef2f2;
			--danger-border: rgba(185, 28, 28, 0.25);

			--warn: #b45309;
			--warn-tint: #fef3c7;
			--warn-border: rgba(180, 83, 9, 0.3);

			--success: #15803d;
			--success-tint: #ecfdf5;
			--success-border: rgba(21, 128, 61, 0.25);

			--radius-sm: 0.4rem;
			--radius: 0.55rem;
			--radius-lg: 0.85rem;

			--shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05), 0 1px 1px rgba(15, 23, 42, 0.025);
			--shadow: 0 2px 4px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
			--shadow-md: 0 6px 12px rgba(15, 23, 42, 0.08), 0 2px 4px rgba(15, 23, 42, 0.05);

			--font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI",
				Roboto, "Helvetica Neue", Arial, sans-serif;
			--font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
		}

		@media (prefers-color-scheme: dark) {
			:root {
				--bg: #0c0a09;
				--surface: #1c1917;
				--surface-2: #292524;
				--border: #292524;
				--border-strong: #44403c;
				--text: #fafaf9;
				--text-muted: #a8a29e;
				--text-faint: #78716c;

				--accent: #10b981;
				--accent-hover: #34d399;
				--accent-fg: #0c0a09;
				--accent-tint: #064e3b;
				--accent-soft: rgba(16, 185, 129, 0.18);

				--danger: #f87171;
				--danger-fg: #fafaf9;
				--danger-tint: #450a0a;
				--danger-border: rgba(248, 113, 113, 0.3);

				--warn: #fbbf24;
				--warn-tint: #451a03;
				--warn-border: rgba(251, 191, 36, 0.3);

				--success: #4ade80;
				--success-tint: #052e16;
				--success-border: rgba(74, 222, 128, 0.3);

				--shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 1px rgba(0, 0, 0, 0.25);
				--shadow: 0 2px 4px rgba(0, 0, 0, 0.5), 0 1px 2px rgba(0, 0, 0, 0.3);
				--shadow-md: 0 6px 12px rgba(0, 0, 0, 0.55), 0 2px 4px rgba(0, 0, 0, 0.35);
			}
		}

		* { box-sizing: border-box; }

		body {
			font-family: var(--font-sans);
			font-feature-settings: "cv02", "cv03", "cv04", "cv11";
			background: var(--bg);
			color: var(--text);
			margin: 0;
			line-height: 1.55;
			-webkit-font-smoothing: antialiased;
			-moz-osx-font-smoothing: grayscale;
		}

		.container { max-width: 36rem; margin: 0 auto; padding: 2.5rem 1.5rem; }
		.container.wide { max-width: 60rem; }
		.row-between { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }

		/* topbar */
		.topbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 0.85rem 1.5rem;
			border-bottom: 1px solid var(--border);
			background: color-mix(in srgb, var(--surface) 80%, transparent);
			backdrop-filter: saturate(180%) blur(10px);
			-webkit-backdrop-filter: saturate(180%) blur(10px);
			position: sticky;
			top: 0;
			z-index: 10;
			gap: 0.75rem;
		}
		.topbar .brand {
			display: inline-flex;
			align-items: center;
			gap: 0.55rem;
			font-size: 0.95rem;
			font-weight: 700;
			letter-spacing: -0.01em;
			color: var(--text);
			text-decoration: none;
			white-space: nowrap;
			flex-shrink: 0;
		}
		.brand-mark {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 1.55rem;
			height: 1.55rem;
			border-radius: var(--radius-sm);
			background: linear-gradient(135deg, var(--accent), var(--accent-hover));
			color: var(--accent-fg);
			font-size: 0.78rem;
			font-weight: 700;
			letter-spacing: 0;
			box-shadow: var(--shadow-sm);
			flex-shrink: 0;
		}
		.topbar nav {
			display: flex;
			align-items: center;
			gap: 1rem;
			flex-wrap: wrap;
			row-gap: 0.5rem;
			justify-content: flex-end;
		}

		/* Administrator disclosure menu — same markup at all widths.
		   On desktop the panel floats below the summary; on mobile the
		   summary just expands inline inside the drawer. */
		.nav-menu { position: relative; }
		.nav-menu > summary {
			cursor: pointer;
			user-select: none;
			list-style: none;
			display: inline-flex;
			align-items: center;
			gap: 0.3rem;
		}
		.nav-menu > summary::-webkit-details-marker { display: none; }
		.nav-menu > summary::after {
			content: "";
			width: 0.4rem;
			height: 0.4rem;
			border-right: 1.5px solid currentColor;
			border-bottom: 1.5px solid currentColor;
			transform: rotate(45deg) translate(-1px, -1px);
			transition: transform 0.15s ease;
			opacity: 0.6;
		}
		.nav-menu[open] > summary::after {
			transform: rotate(-135deg) translate(-1px, -1px);
		}
		.nav-menu-items {
			display: flex;
			flex-direction: column;
			gap: 0.4rem;
			min-width: 11rem;
			padding: 0.65rem;
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			box-shadow: var(--shadow-md);
			position: absolute;
			right: 0;
			top: calc(100% + 0.55rem);
			z-index: 11;
		}
		.nav-menu-items .nav-link {
			padding: 0.35rem 0.5rem;
			border-radius: var(--radius-sm);
		}
		.nav-menu-items .nav-link:hover {
			background: var(--accent-tint);
			color: var(--accent);
		}

		/* Hamburger toggle — only visible on narrow viewports */
		.nav-toggle {
			display: none;
			background: transparent;
			color: var(--text);
			border: 1px solid var(--border-strong);
			padding: 0.4rem 0.55rem;
			box-shadow: none;
			line-height: 0;
		}
		.nav-toggle:hover { background: var(--surface-2); }
		.nav-toggle svg { display: block; }

		@media (max-width: 640px) {
			.topbar { padding: 0.7rem 1rem; }
			.brand-text { display: none; }
			.nav-toggle { display: inline-flex; }
			.topbar nav {
				display: none;
				position: absolute;
				top: 100%;
				right: 0.65rem;
				left: 0.65rem;
				flex-direction: column;
				align-items: stretch;
				gap: 0.25rem;
				padding: 0.85rem;
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: var(--radius);
				box-shadow: var(--shadow-md);
			}
			.topbar nav.open { display: flex; }
			.topbar nav .nav-link,
			.topbar nav form,
			.topbar nav .nav-menu {
				width: 100%;
			}
			.topbar nav .nav-link {
				padding: 0.55rem 0.65rem;
				border-radius: var(--radius-sm);
				font-size: 0.95rem;
			}
			.topbar nav .nav-link:hover { background: var(--accent-tint); }
			/* Inline the admin items inside the mobile drawer instead of floating. */
			.nav-menu-items {
				position: static;
				box-shadow: none;
				border: 0;
				padding: 0.25rem 0 0.25rem 0.85rem;
				background: transparent;
				min-width: 0;
				margin-top: 0.25rem;
			}
			.nav-signout-email { display: none; }
			.topbar nav .linkish { padding: 0.55rem 0.65rem; text-align: left; }
		}

		/* typography */
		h1 {
			margin: 0 0 0.75rem;
			font-size: 1.75rem;
			font-weight: 700;
			letter-spacing: -0.025em;
			line-height: 1.2;
		}
		h2 {
			margin: 1.75rem 0 0.75rem;
			font-size: 1.05rem;
			font-weight: 700;
			letter-spacing: -0.01em;
		}
		h2.section-label {
			font-size: 0.72rem;
			text-transform: uppercase;
			letter-spacing: 0.08em;
			color: var(--text-muted);
			font-weight: 700;
			margin: 2rem 0 0.75rem;
		}
		p { margin: 0.5rem 0 1.25rem; color: var(--text); }
		.muted { color: var(--text-muted); }
		.hint { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.3rem; }
		.nav-link {
			font-size: 0.875rem;
			color: var(--text-muted);
			text-decoration: none;
			font-weight: 500;
			transition: color 0.12s ease;
		}
		.nav-link:hover { color: var(--text); }

		/* forms */
		form { display: flex; flex-direction: column; gap: 0.95rem; }
		label { font-weight: 600; font-size: 0.85rem; display: block; margin-bottom: 0.3rem; color: var(--text); }
		input[type=email],
		input[type=password],
		input[type=text],
		input[type=number],
		textarea {
			width: 100%;
			padding: 0.65rem 0.85rem;
			border: 1px solid var(--border-strong);
			border-radius: var(--radius-sm);
			font-size: 0.95rem;
			font-family: inherit;
			background: var(--surface);
			color: var(--text);
			transition: border-color 0.12s ease, box-shadow 0.12s ease;
		}
		input:focus,
		textarea:focus,
		select:focus {
			outline: 0;
			border-color: var(--accent);
			box-shadow: 0 0 0 3px var(--accent-soft);
		}
		textarea { resize: vertical; min-height: 5rem; line-height: 1.5; }

		/* buttons */
		button, .btn {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 0.4rem;
			padding: 0.6rem 1.05rem;
			border: 0;
			border-radius: var(--radius-sm);
			background: var(--accent);
			color: var(--accent-fg);
			font-weight: 600;
			font-size: 0.925rem;
			font-family: inherit;
			cursor: pointer;
			box-shadow: var(--shadow-sm);
			transition: background 0.12s ease, box-shadow 0.12s ease, transform 0.06s ease;
		}
		button:hover, .btn:hover { background: var(--accent-hover); box-shadow: var(--shadow); }
		button:active, .btn:active { transform: translateY(1px); box-shadow: none; }
		button.secondary {
			background: var(--surface);
			color: var(--accent);
			border: 1px solid var(--border-strong);
			box-shadow: none;
		}
		button.secondary:hover { background: var(--accent-tint); border-color: var(--accent); box-shadow: none; }
		button.linkish {
			background: transparent;
			color: var(--accent);
			padding: 0.3rem 0.5rem;
			font-weight: 500;
			font-size: 0.875rem;
			box-shadow: none;
		}
		button.linkish:hover { background: var(--accent-soft); }
		button.linkish.danger { color: var(--danger); }
		button.linkish.danger:hover { background: var(--danger-tint); }

		/* file input */
		input[type=file] {
			padding: 0.5rem;
			border: 1px dashed var(--border-strong);
			border-radius: var(--radius-sm);
			width: 100%;
			background: var(--surface-2);
			font-size: 0.9rem;
			color: var(--text);
		}
		input[type=file]::file-selector-button {
			margin-right: 0.75rem;
			padding: 0.35rem 0.85rem;
			border: 0;
			border-radius: var(--radius-sm);
			background: var(--accent);
			color: var(--accent-fg);
			font-size: 0.85rem;
			font-weight: 600;
			cursor: pointer;
		}

		/* select */
		select {
			padding: 0.45rem 0.75rem;
			border: 1px solid var(--border-strong);
			border-radius: var(--radius-sm);
			background: var(--surface);
			color: var(--text);
			font-size: 0.9rem;
			font-family: inherit;
			cursor: pointer;
		}

		/* fieldset */
		fieldset {
			border: 1px solid var(--border);
			border-radius: var(--radius);
			padding: 1.25rem 1.5rem;
			margin: 1.5rem 0;
			background: var(--surface);
		}
		fieldset > legend {
			font-weight: 700;
			font-size: 0.7rem;
			text-transform: uppercase;
			letter-spacing: 0.08em;
			color: var(--text-muted);
			padding: 0 0.5rem;
		}
		fieldset > div + div { margin-top: 1rem; }

		/* code / pre */
		pre {
			background: var(--surface-2);
			color: var(--text);
			padding: 0.85rem 1rem;
			border-radius: var(--radius-sm);
			border: 1px solid var(--border);
			overflow-x: auto;
			font-size: 0.8rem;
			line-height: 1.5;
			font-family: var(--font-mono);
		}
		code { font-family: var(--font-mono); font-size: 0.88em; }

		/* pills */
		.pill {
			display: inline-block;
			padding: 0.15rem 0.625rem;
			border-radius: 9999px;
			font-size: 0.7rem;
			font-weight: 600;
			letter-spacing: 0.02em;
		}
		.pill.on { background: var(--success-tint); color: var(--success); }
		.pill.off { background: var(--danger-tint); color: var(--danger); }

		/* table */
		table.apps {
			width: 100%;
			border-collapse: collapse;
			margin-top: 1rem;
			font-size: 0.925rem;
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			overflow: hidden;
		}
		table.apps th, table.apps td {
			text-align: left;
			padding: 0.8rem 0.9rem;
			border-bottom: 1px solid var(--border);
			vertical-align: top;
		}
		table.apps tr:last-child td { border-bottom: 0; }
		table.apps th {
			font-size: 0.7rem;
			text-transform: uppercase;
			letter-spacing: 0.06em;
			color: var(--text-muted);
			font-weight: 600;
			background: var(--surface-2);
		}
		table.apps code {
			background: var(--surface-2);
			padding: 0.1rem 0.4rem;
			border-radius: 0.25rem;
			color: var(--text);
		}
		td.actions { white-space: nowrap; display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }

		/* flashes / errors */
		.flashes { margin: 1rem 0 0.5rem; display: flex; flex-direction: column; gap: 0.5rem; }
		.flash {
			padding: 0.75rem 1rem;
			border-radius: var(--radius-sm);
			background: var(--success-tint);
			color: var(--success);
			border: 1px solid var(--success-border);
			font-size: 0.9rem;
		}
		.flash.flash-error {
			background: var(--danger-tint);
			color: var(--danger);
			border-color: var(--danger-border);
		}
		.error {
			background: var(--danger-tint);
			color: var(--danger);
			padding: 0.85rem 1rem;
			border-radius: var(--radius-sm);
			border: 1px solid var(--danger-border);
			margin-bottom: 1rem;
		}
		.error ul { list-style: disc; padding-left: 1.25rem; margin: 0; }

		/* tiles */
		.tile-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr));
			gap: 0.9rem;
			margin-top: 1rem;
		}
		.tile {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 0.7rem;
			padding: 1.4rem 0.85rem;
			border-radius: var(--radius);
			text-decoration: none;
			color: var(--text);
			background: var(--surface);
			border: 1px solid var(--border);
			box-shadow: var(--shadow-sm);
			transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
		}
		.tile:hover {
			box-shadow: var(--shadow-md);
			border-color: var(--border-strong);
			transform: translateY(-1px);
		}
		.tile:active { transform: translateY(0); box-shadow: var(--shadow-sm); }
		.tile img {
			width: 3rem;
			height: 3rem;
			border-radius: var(--radius-sm);
			object-fit: cover;
		}
		.tile span {
			font-size: 0.88rem;
			font-weight: 600;
			text-align: center;
			letter-spacing: -0.005em;
		}

		/* empty state */
		.empty {
			text-align: center;
			padding: 3rem 1.5rem;
			background: var(--surface);
			border-radius: var(--radius);
			border: 1px dashed var(--border-strong);
			margin-top: 0.5rem;
		}
		.empty h2 { margin: 0 0 0.5rem; font-size: 1.15rem; color: var(--text); letter-spacing: -0.01em; }
		.empty p { margin: 0.25rem 0; color: var(--text-muted); }

		/* warning banner (used on admin dashboard in legacy mode) */
		.warn-banner {
			background: var(--warn-tint);
			color: var(--warn);
			padding: 0.85rem 1rem;
			border-radius: var(--radius-sm);
			border: 1px solid var(--warn-border);
			margin-bottom: 1.25rem;
			font-size: 0.88rem;
			line-height: 1.5;
		}
		.warn-banner strong { color: var(--warn); }
		.warn-banner code {
			background: color-mix(in srgb, var(--warn) 12%, transparent);
			padding: 0.05rem 0.35rem;
			border-radius: 0.25rem;
			font-size: 0.85em;
			color: inherit;
		}

		/* Page-level credit footer (used on the dashboard) */
		.credit {
			margin-top: 3.5rem;
			padding-top: 1.5rem;
			border-top: 1px solid var(--border);
			text-align: center;
			color: var(--text-faint);
			font-size: 0.825rem;
			line-height: 1.6;
		}
		.credit a {
			color: var(--text-muted);
			text-decoration: none;
			border-bottom: 1px solid var(--border-strong);
			transition: color 0.12s ease, border-color 0.12s ease;
		}
		.credit a:hover {
			color: var(--accent);
			border-color: var(--accent);
		}
		.credit .credit-dot {
			margin: 0 0.5rem;
			color: var(--text-faint);
			opacity: 0.6;
		}

		@supports (padding: env(safe-area-inset-top)) {
			.topbar { padding-top: max(0.85rem, env(safe-area-inset-top)); }
		}
	</style>
</head>
<body>
	{% block topbar %}
	{% if user %}
	<div class="topbar">
		<a href="/" class="brand">
			<span class="brand-mark">P</span>
			<span class="brand-text">PWA Portal</span>
		</a>
		<button type="button" class="nav-toggle" aria-label="Toggle navigation"
			aria-controls="primary-nav" aria-expanded="false">
			<svg width="20" height="20" viewBox="0 0 24 24" fill="none"
				stroke="currentColor" stroke-width="2"
				stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
				<line x1="4" y1="7" x2="20" y2="7"></line>
				<line x1="4" y1="12" x2="20" y2="12"></line>
				<line x1="4" y1="17" x2="20" y2="17"></line>
			</svg>
		</button>
		<nav id="primary-nav">
			<a href="/" class="nav-link">Apps</a>
			{% if user.role == "admin" %}
			<details class="nav-menu">
				<summary class="nav-link">Administrator</summary>
				<div class="nav-menu-items">
					<a href="/admin/apps" class="nav-link">Apps</a>
					<a href="/admin/users" class="nav-link">Users</a>
					<a href="/admin/settings" class="nav-link">Settings</a>
					<a href="/admin/tokens" class="nav-link">API tokens</a>
					<a href="/admin/backup" class="nav-link">Backup</a>
				</div>
			</details>
			{% endif %}
			<a href="/profile" class="nav-link">Profile</a>
			<form method="post" action="/logout" style="margin:0;">
				<input type="hidden" name="_csrf" value="{{ csrf_token }}">
				<button type="submit" class="linkish">
					<span class="nav-signout-text">Sign out</span>
					<span class="nav-signout-email">({{ user.email }})</span>
				</button>
			</form>
		</nav>
	</div>
	{% endif %}
	{% endblock %}
	<main class="container {% block container_class %}{% endblock %}">
		{% if flashes %}
		<div class="flashes">
			{% for f in flashes %}
			<div class="flash flash-{{ f.level }}">{{ f.message }}</div>
			{% endfor %}
		</div>
		{% endif %}
		{% block content %}{% endblock %}
	</main>

	<script>
		if ("serviceWorker" in navigator) {
			window.addEventListener("load", () => {
				navigator.serviceWorker.register("/sw.js").catch((e) => console.warn("SW register failed", e));
			});
		}

		// Mobile hamburger toggle. The nav itself is positioned absolutely
		// below the topbar at narrow widths; the .open class flips it visible.
		(function () {
			const toggle = document.querySelector(".nav-toggle");
			const nav = document.getElementById("primary-nav");
			if (!toggle || !nav) return;
			toggle.addEventListener("click", function (e) {
				e.stopPropagation();
				const open = nav.classList.toggle("open");
				toggle.setAttribute("aria-expanded", open ? "true" : "false");
			});
			// Tap outside / press Escape closes the drawer.
			document.addEventListener("click", function (e) {
				if (!nav.classList.contains("open")) return;
				if (nav.contains(e.target) || toggle.contains(e.target)) return;
				nav.classList.remove("open");
				toggle.setAttribute("aria-expanded", "false");
			});
			document.addEventListener("keydown", function (e) {
				if (e.key === "Escape" && nav.classList.contains("open")) {
					nav.classList.remove("open");
					toggle.setAttribute("aria-expanded", "false");
				}
			});
		})();
	</script>
</body>
</html>
