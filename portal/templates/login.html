{% extends "base.html" %}
{% block title %}Sign in — {{ branding.business_name }}{% endblock %}
{% block content %}
<div class="auth-brand">
	{% if branding.logo_url %}
	<img src="{{ branding.logo_url }}" alt="" class="auth-brand-logo">
	{% else %}
	<span class="auth-brand-mark">{{ branding.business_name[0]|upper }}</span>
	{% endif %}
	<div class="auth-brand-name">{{ branding.business_name }}</div>
</div>
<h1>Sign in</h1>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post" action="/login" autocomplete="on">
	<input type="hidden" name="_csrf" value="{{ csrf_token }}">
	<input type="hidden" name="next" value="{{ next|default('/') }}">
	<div>
		<label for="email">Email</label>
		<input type="email" name="email" id="email" required value="{{ email|default('') }}" autocomplete="username">
	</div>
	<div>
		<label for="password">Password</label>
		<input type="password" name="password" id="password" required autocomplete="current-password">
	</div>
	<button type="submit">Sign in</button>
</form>
{% endblock %}
